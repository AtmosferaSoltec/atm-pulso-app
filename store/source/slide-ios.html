<!doctype html><meta charset=utf-8><style>
@font-face{font-family:M;font-weight:800;src:url(shots/m800.ttf)}
@font-face{font-family:M;font-weight:500;src:url(shots/m500.ttf)}
*{margin:0;box-sizing:border-box}
body{width:1206px;height:2622px;overflow:hidden;font-family:M;position:relative;
 background:linear-gradient(160deg,#145f72 0%,#176B80 45%,#1fa89f 120%)}
.ring{position:absolute;border:3px solid rgba(255,255,255,.13);border-radius:50%}
.txt{position:absolute;left:100px;right:100px;top:140px}
h1{color:#fff;font-weight:800;font-size:116px;line-height:1.05;letter-spacing:-2.5px}
p{margin-top:30px;color:rgba(255,255,255,.88);font-weight:500;font-size:52px;line-height:1.3}
.wrap{position:absolute;left:145px;top:630px;width:426px;height:898px;transform:scale(2.15);transform-origin:0 0}
.btn{position:absolute;background:#2a2a2d;border-radius:2px}
.phone{position:absolute;inset:0;border-radius:66px;background:linear-gradient(145deg,#3a3a3d,#17171a 40%,#2b2b2e);padding:12px;
 box-shadow:0 30px 60px rgba(0,20,30,.45)}
.screen{position:relative;width:402px;height:874px;border-radius:54px;overflow:hidden;background:#000;box-shadow:0 0 0 2px #000}
.strip{position:absolute;left:0;top:0;width:402px;height:62px}
.shot{position:absolute;left:0;top:62px;width:402px;height:812px;display:block}
.island{position:absolute;top:14px;left:50%;margin-left:-62px;width:124px;height:36px;border-radius:18px;background:#000;z-index:3}
.sb{position:absolute;top:18px;z-index:2;font-weight:800;font-size:16px;font-family:-apple-system,"SF Pro",M,sans-serif}
.home{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;z-index:3}
</style>
<div class=ring style="width:1300px;height:1300px;right:-500px;top:-450px"></div>
<div class=ring style="width:880px;height:880px;right:-300px;top:-230px"></div>
<div class=txt><h1 id=t></h1><p id=s></p></div>
<div class=wrap>
 <div class=btn style="left:-3px;top:150px;width:3px;height:28px"></div>
 <div class=btn style="left:-3px;top:210px;width:3px;height:52px"></div>
 <div class=btn style="left:-3px;top:278px;width:3px;height:52px"></div>
 <div class=btn style="right:-3px;top:232px;width:3px;height:84px"></div>
 <div class=phone><div class=screen>
  <div class=strip id=strip></div><img class=shot id=i>
  <div class=island></div>
  <div class=sb id=time style="left:38px">9:41</div>
  <div class=sb id=icons style="right:30px;display:flex;gap:6px;align-items:center">
   <svg width=18 height=12 viewBox="0 0 18 12"><rect x=0 y=8 width=3 height=4 rx=1 fill=currentColor /><rect x=5 y=5 width=3 height=7 rx=1 fill=currentColor /><rect x=10 y=2.5 width=3 height=9.5 rx=1 fill=currentColor /><rect x=15 y=0 width=3 height=12 rx=1 fill=currentColor /></svg>
   <svg width=26 height=12 viewBox="0 0 26 12"><rect x=.5 y=.5 width=22 height=11 rx=3.5 fill=none stroke=currentColor opacity=.45 /><rect x=2 y=2 width=19 height=8 rx=2 fill=currentColor /><rect x=24 y=4 width=1.8 height=4 rx=1 fill=currentColor opacity=.5 /></svg>
  </div>
  <div class=home id=home></div>
 </div></div>
</div>
<script>
const D={
1:["Miembros al instante","Busca por nombre o DNI y mira quién está vigente, por vencer o vencido.","01-home"],
2:["Su ficha, a un toque","Historial de membresías y contacto por llamada o WhatsApp.","02-ficha"],
3:["Renueva en segundos","Duración, precio y fecha de inicio ya vienen sugeridos.","03-renovar"],
4:["Vende y cobra rápido","Productos del gimnasio con Yape/Plin, efectivo, tarjeta o transferencia.","04-venta"]};
const q=new URLSearchParams(location.search), n=q.get("n"), d=D[n];
t.textContent=d[0];s.textContent=d[1];i.src="ios/"+d[2]+".png";
const l=q.get("l"), r=q.get("r"), dark=q.get("dark")==="1";
strip.style.background=`linear-gradient(90deg,${l},${r})`;
const fg=dark?"#fff":"#111";time.style.color=fg;icons.style.color=fg;home.style.background=dark?"rgba(255,255,255,.85)":"rgba(0,0,0,.8)";
</script>
